services:
  - type: web
    runtime: node
    name: medcopilot-doctor
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    disk:
      name: medcopilot-doctor-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_INFERENCE_URL
        value: https://medcopilot-ai.onrender.com
      - key: AI_INFERENCE_SERVICE_URL
        value: https://medcopilot-ai.onrender.com
      - key: PATIENT_APP_URL
        sync: false

  - type: web
    runtime: static
    name: medcopilot-user
    rootDir: user-healthcare-main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DOCTOR_APP_URL
        sync: false

  - type: web
    runtime: docker
    name: medcopilot-ai
    dockerfilePath: backend/ai-inference-service/Dockerfile
    dockerContext: backend/ai-inference-service
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ENABLE_QDRANT_RAG
        value: "false"
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: ENABLE_HF_XRAY
        value: "true"
      - key: HF_TOKEN
        sync: false
      - key: HF_BROAD_XRAY_MODEL
        value: torchxrayvision/densenet121-res224-all
      - key: HF_TB_XRAY_MODEL
        value: JetX-GT/hades-hellix-tb-linear-probe
      - key: HF_BROAD_XRAY_ENDPOINT_URL
        sync: false
      - key: HF_TB_XRAY_ENDPOINT_URL
        sync: false
      - key: HF_ALLOW_MODEL_API_FALLBACK
        value: "true"
      - key: HF_INFERENCE_BASE_URL
        value: https://router.huggingface.co/hf-inference/models
      - key: ENABLE_HF_SPACE_XRAY
        value: "true"
      - key: HF_BROAD_XRAY_SPACE_URL
        value: https://itsomk-multilabel-chestxray-gradcam.hf.space
      - key: HF_BROAD_XRAY_SPACE_API_NAME
        value: analyze_and_prepare_download
      - key: HF_TB_XRAY_SPACE_URL
        sync: false
      - key: HF_TB_XRAY_SPACE_API_NAME
        value: predict
      - key: ENABLE_LOCAL_TORCHXRAYVISION
        value: "true"
      - key: ENABLE_LOCAL_MOBILEVIT_XRAY
        value: "true"
      - key: LOCAL_MOBILEVIT_XRAY_MODEL
        value: Jesteban247/mobilevit_small-chest_xray
      - key: LOCAL_MOBILEVIT_RETRY_SECONDS
        value: "300"
      - key: HF_SPACE_XRAY_TIMEOUT_SECONDS
        value: "30"
      - key: HF_SPACE_XRAY_POLL_TIMEOUT_SECONDS
        value: "120"
      - key: XRAY_PNEUMONIA_SHOW_THRESHOLD
        value: "72"
      - key: XRAY_NORMAL_SHOW_THRESHOLD
        value: "80"
      - key: XRAY_BROAD_MIN_SCORE
        value: "0.6"
      - key: XRAY_TB_MIN_SCORE
        value: "0.65"
